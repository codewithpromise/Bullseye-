<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bullseye Admin</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#0B0B0B;--bone:#F4F1EA;--paper:#FFFFFF;--line:#DDD8CC;--muted:#5E5B55;--accent:#FF3B2F;--danger:#B3261E;--ok:#1B6E3A}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.word{font-family:Archivo,Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:2px solid var(--ink);background:var(--ink);color:var(--bone);font-weight:700;font-size:14px;letter-spacing:.04em;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filebtn:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.field,input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);font-size:16px}
textarea{resize:vertical}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}
.hint{font-weight:400;font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:21px;margin:10px 0}
.muted{color:var(--muted);font-size:14px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:400px;background:var(--paper);border:2px solid var(--ink);padding:28px}
.login h1{margin:0 0 4px;font-size:30px}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--bone);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
.brandrow{display:flex;align-items:center;gap:10px}
.brandrow .mark{height:32px;width:auto}
.brandrow .logo-word{height:13px;width:auto}
.brandrow .adm{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BDBDBD}
.top .grow{flex:1}
.top .who{font-size:13px;color:#BDBDBD;word-break:break-all}
.top .btn{background:transparent;color:var(--bone);border-color:var(--bone);min-height:40px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.tab{flex:none;min-height:44px;padding:0 16px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bone)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 200px}
.card{background:var(--paper);border:2px solid var(--ink);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:18px}
.prow{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--ink);padding:12px;margin-bottom:10px}
.pthumb{flex:none;width:64px;height:80px;background:#E9E4D8;object-fit:cover;display:block}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;background:var(--bone);border:1px solid var(--ink)}
.chip.bad{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.good{background:var(--ok);border-color:var(--ok);color:#fff}
.pact{display:flex;flex-wrap:wrap;gap:8px}
.pact .btn{min-height:40px;padding:0 14px;font-size:13px}
.ohead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-bottom:6px}
.items{margin:8px 0;padding-left:18px}
.otot{font-weight:700;margin-bottom:10px}
.orow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.orow select{width:auto;min-width:160px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters button{min-height:40px;padding:0 14px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bone)}
.srow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.srow span{overflow-wrap:anywhere}
.imgfield{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.imgprev{width:96px;height:120px;background:#E9E4D8;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;overflow:hidden}
.imgprev img{width:100%;height:100%;object-fit:cover}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.sheet{background:var(--paper);border:2px solid var(--ink);width:100%;max-width:640px;padding:20px;margin:auto}
.sheet h2{margin:0 0 4px;font-size:24px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{min-height:36px;padding:0 12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:13px}
fieldset{border:2px solid var(--line);margin:16px 0 0;padding:8px 14px 12px}
legend{font-size:14px;font-weight:600;padding:0 6px}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:500}
.check input{width:22px;height:22px;flex:none}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.imgbox{width:104px}
.imgbox img{width:104px;height:130px;object-fit:cover;background:#E9E4D8;display:block}
.imgbox .main{font-size:11px;font-weight:700;margin:2px 0}
.imgbox button{width:100%;min-height:36px;margin-top:4px;border:2px solid var(--ink);background:transparent;font-size:12px;font-weight:700}
.sactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bone);padding:12px 18px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="center" id="loginView" hidden>
  <form class="login" id="loginForm" novalidate>
    <h1 class="word">Bullseye</h1>
    <p class="muted" style="margin:0 0 8px">Admin sign in</p>
    <label for="lEmail">Email</label>
    <input id="lEmail" type="email" autocomplete="username">
    <label for="lPass">Password</label>
    <input id="lPass" type="password" autocomplete="current-password">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit" id="loginBtn" style="width:100%">Sign in</button>
  </form>
</div>

<div class="center" id="deniedView" hidden>
  <div class="login">
    <h1 class="word">No access</h1>
    <p>The account <strong id="deniedWho"></strong> is not an admin of this shop. If this is your account, run <code>add-admin.sql</code> in Supabase with this email.</p>
    <button class="btn" type="button" id="deniedOut">Sign out</button>
  </div>
</div>

<div id="appView" hidden>
  <header class="top">
    <span class="brandrow" role="img" aria-label="Bullseye admin"><img class="mark" src="logo-mark.png" alt="" width="31" height="32"><img class="logo-word" src="logo-wordmark.png" alt="" width="149" height="13"><span class="adm" aria-hidden="true">Admin</span></span>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <a class="btn" href="./">View site</a>
    <button class="btn" type="button" id="logout">Sign out</button>
  </header>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button class="tab" role="tab" id="tab-products" data-tab="products" aria-selected="true" aria-controls="panel-products">Products</button>
      <button class="tab" role="tab" id="tab-orders" data-tab="orders" aria-selected="false" aria-controls="panel-orders">Orders</button>
      <button class="tab" role="tab" id="tab-subs" data-tab="subs" aria-selected="false" aria-controls="panel-subs">Email list</button>
      <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-selected="false" aria-controls="panel-settings">Settings</button>
    </div>

    <section id="panel-products" role="tabpanel" aria-labelledby="tab-products">
      <div class="bar">
        <input class="grow" id="pSearch" type="search" placeholder="Search products" aria-label="Search products">
        <button class="btn accent" type="button" id="pAdd">Add product</button>
      </div>
      <div id="pList"></div>
    </section>

    <section id="panel-orders" role="tabpanel" aria-labelledby="tab-orders" hidden>
      <div class="bar"><button class="btn alt" type="button" id="oRefresh">Refresh</button></div>
      <div class="filters" id="oFilters" role="group" aria-label="Filter orders"></div>
      <div id="oList"></div>
    </section>

    <section id="panel-subs" role="tabpanel" aria-labelledby="tab-subs" hidden>
      <div class="bar">
        <button class="btn alt" type="button" id="sCopy">Copy all emails</button>
        <button class="btn alt" type="button" id="sRefresh">Refresh</button>
      </div>
      <div class="card" id="sList"></div>
    </section>

    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div id="setBody"></div>
    </section>
  </div>
</div>

<div class="overlay" id="pf" hidden>
  <form class="sheet" id="pForm" role="dialog" aria-modal="true" aria-labelledby="pfTitle" novalidate>
    <h2 id="pfTitle">Add product</h2>
    <label for="fName">Name</label>
    <input id="fName" type="text" maxlength="120">
    <div class="row2">
      <div><label for="fCat">Category</label><select id="fCat"></select></div>
      <div><label for="fPrice">Price</label><input id="fPrice" type="number" inputmode="decimal" min="0" step="any"></div>
    </div>
    <label for="fDesc">Description</label>
    <textarea id="fDesc" rows="4"></textarea>
    <label for="fSizes">Sizes <span class="hint">(separate with commas)</span></label>
    <input id="fSizes" type="text" placeholder="S, M, L, XL">
    <div class="quick" id="fQuick" aria-label="Quick add sizes">
      <button type="button" data-q="S">S</button><button type="button" data-q="M">M</button><button type="button" data-q="L">L</button><button type="button" data-q="XL">XL</button><button type="button" data-q="XXL">XXL</button><button type="button" data-q="One size">One size</button>
    </div>
    <label for="fColors">Colours <span class="hint">(separate with commas)</span></label>
    <input id="fColors" type="text" placeholder="Black, Bone">
    <fieldset>
      <legend>Status</legend>
      <label class="check"><input type="checkbox" id="fStock"> In stock</label>
      <label class="check"><input type="checkbox" id="fNew"> Show "New" tag (new drop)</label>
      <label class="check"><input type="checkbox" id="fFeat"> Show first on the shop page</label>
    </fieldset>
    <label>Pictures <span class="hint">(the first one is the main picture)</span></label>
    <div class="imgs" id="fImgs"></div>
    <label class="btn alt filebtn" style="margin:0">Add pictures<input class="sr" id="fFiles" type="file" accept="image/*" multiple></label>
    <span class="hint" id="fUp" role="status"></span>
    <p class="err" id="fErr" role="alert"></p>
    <div class="sactions">
      <button class="btn accent" type="submit" id="fSave">Save product</button>
      <button class="btn alt" type="button" id="fCancel">Cancel</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.BULLSEYE_CONFIG || {};
  var CATS = (Array.isArray(CFG.CATEGORIES) && CFG.CATEGORIES.length) ? CFG.CATEGORIES : ['Men', 'Women', 'Unisex', 'Accessories'];
  var STATUSES = ['new', 'confirmed', 'paid', 'shipped', 'delivered', 'cancelled'];
  var CONFIGURED = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY &&
    String(CFG.SUPABASE_URL).indexOf('PASTE_') !== 0 && String(CFG.SUPABASE_ANON_KEY).indexOf('PASTE_') !== 0);
  var BUCKET = 'product-images';
  var sb = null;
  var state = {
    products: [], orders: [], subs: [], settings: {},
    pq: '', ofilter: 'all',
    editId: null, imgs: [], fNew: [], fDelete: [], uploading: 0,
    sDelete: []
  };

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
  function slug(c) { return String(c).toLowerCase().replace(/[^a-z0-9]+/g, '_'); }
  function errText(e) { return (e && e.message) ? e.message : 'Something went wrong.'; }
  function money(n) {
    var v = Number(n) || 0;
    var sym = state.settings.currency_symbol || '₦';
    return sym + v.toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function fmtDate(d) {
    var x = new Date(d);
    return isNaN(x) ? '' : x.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function uid() {
    return (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : (String(Date.now()) + Math.random().toString(16).slice(2));
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3000);
  }
  function show(id) {
    ['loginView', 'deniedView', 'appView'].forEach(function (v) { $('#' + v).hidden = (v !== id); });
  }
  function splitList(str) {
    var seen = {}, out = [];
    String(str || '').split(',').forEach(function (x) {
      var v = x.trim().slice(0, 30);
      if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = 1; out.push(v); }
    });
    return out.slice(0, 20);
  }
  function waLink(phone) {
    var d = String(phone || '').replace(/\D/g, '');
    if (/^0\d{10}$/.test(d)) d = '234' + d.slice(1);
    return d.length >= 8 ? 'https://wa.me/' + d : '';
  }

  /* ---------- Pictures ---------- */
  function compress(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          URL.revokeObjectURL(url);
          if (b) resolve(b); else reject(new Error('Could not process that picture'));
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not a picture I can read')); };
      img.src = url;
    });
  }
  function uploadImage(file, folder, max) {
    return compress(file, max).then(function (blob) {
      var path = folder + '/' + uid() + '.jpg';
      return sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' }).then(function (r) {
        if (r.error) throw r.error;
        return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      });
    });
  }
  function removeFromStorage(urls) {
    var marker = '/' + BUCKET + '/';
    var paths = (urls || []).map(function (u) {
      var i = String(u).indexOf(marker);
      if (i === -1) return '';
      try { return decodeURIComponent(String(u).slice(i + marker.length).split('?')[0]); } catch (e) { return ''; }
    }).filter(Boolean);
    if (!paths.length) return Promise.resolve();
    return sb.storage.from(BUCKET).remove(paths).then(function () {}, function () {});
  }

  /* ---------- Sign in ---------- */
  function afterAuth(session) {
    if (!session) { show('loginView'); return Promise.resolve(); }
    return sb.rpc('is_admin').then(function (r) {
      if (r.error) throw r.error;
      if (r.data === true) {
        $('#who').textContent = session.user.email || '';
        show('appView');
        return startApp();
      }
      $('#deniedWho').textContent = session.user.email || '';
      show('deniedView');
    }).catch(function (e) {
      console.error(e);
      show('loginView');
      $('#loginErr').textContent = 'Could not check your account: ' + errText(e);
    });
  }
  function signOut() {
    sb.auth.signOut().then(function () { show('loginView'); $('#loginErr').textContent = ''; $('#lPass').value = ''; });
  }
  function onLogin(e) {
    e.preventDefault();
    var email = $('#lEmail').value.trim(), pass = $('#lPass').value;
    var err = $('#loginErr'), btn = $('#loginBtn');
    err.textContent = '';
    if (!email || !pass) { err.textContent = 'Please enter your email and password.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) {
      if (r.error) { err.textContent = 'Wrong email or password.'; return; }
      return afterAuth(r.data.session);
    }).catch(function (e2) {
      console.error(e2); err.textContent = 'Something went wrong: ' + errText(e2);
    }).then(function () { btn.disabled = false; btn.textContent = 'Sign in'; });
  }

  /* ---------- Tabs ---------- */
  function setTab(name) {
    $$('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === name)); });
    ['products', 'orders', 'subs', 'settings'].forEach(function (t) { $('#panel-' + t).hidden = (t !== name); });
    if (name === 'orders') loadOrders();
    if (name === 'subs') loadSubs();
  }

  /* ---------- Products ---------- */
  function loadProducts() {
    return sb.from('products').select('*').order('created_at', { ascending: false }).then(function (r) {
      if (r.error) throw r.error;
      state.products = (r.data || []).map(function (p) {
        p.images = p.images || []; p.sizes = p.sizes || []; p.colors = p.colors || [];
        return p;
      });
      renderProducts();
    }).catch(function (e) { console.error(e); toast('Could not load products: ' + errText(e)); });
  }
  function renderProducts() {
    var q = state.pq.trim().toLowerCase();
    var list = state.products.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });
    if (!list.length) {
      $('#pList').innerHTML = '<div class="card"><p class="muted" style="margin:0">' + (state.products.length ? 'No products match your search.' : 'No products yet. Tap "Add product" to add your first one.') + '</p></div>';
      return;
    }
    $('#pList').innerHTML = list.map(function (p) {
      var u = safeUrl(p.images[0]);
      return '<div class="prow">' + (u ? '<img class="pthumb" src="' + esc(u) + '" alt="">' : '<div class="pthumb"></div>') +
        '<div class="pinfo"><div class="pname">' + esc(p.name) + '</div>' +
        '<div class="muted">' + esc(p.category) + ' · ' + esc(money(p.price)) + '</div>' +
        '<div class="chips">' +
          (p.in_stock ? '<span class="chip good">In stock</span>' : '<span class="chip bad">Sold out</span>') +
          (p.is_new ? '<span class="chip">New</span>' : '') +
          (p.is_featured ? '<span class="chip">First on shop</span>' : '') +
          '<span class="chip">' + p.images.length + ' picture' + (p.images.length === 1 ? '' : 's') + '</span>' +
        '</div>' +
        '<div class="pact">' +
          '<button class="btn alt" type="button" data-pact="edit" data-id="' + esc(p.id) + '">Edit</button>' +
          '<button class="btn alt" type="button" data-pact="stock" data-id="' + esc(p.id) + '">' + (p.in_stock ? 'Mark sold out' : 'Mark in stock') + '</button>' +
          '<button class="btn danger" type="button" data-pact="delete" data-id="' + esc(p.id) + '">Delete</button>' +
        '</div></div></div>';
    }).join('');
  }
  function findProduct(id) {
    for (var i = 0; i < state.products.length; i++) if (state.products[i].id === id) return state.products[i];
    return null;
  }
  function onProductAction(e) {
    var b = e.target.closest('[data-pact]');
    if (!b) return;
    var act = b.getAttribute('data-pact'), id = b.getAttribute('data-id'), p = findProduct(id);
    if (!p) return;
    if (act === 'edit') openForm(p);
    else if (act === 'stock') {
      sb.from('products').update({ in_stock: !p.in_stock }).eq('id', id).then(function (r) {
        if (r.error) throw r.error;
        toast(p.in_stock ? 'Marked sold out' : 'Marked in stock');
        return loadProducts();
      }).catch(function (er) { toast('Could not update: ' + errText(er)); });
    } else if (act === 'delete') {
      if (!window.confirm('Delete "' + p.name + '"? This cannot be undone.')) return;
      sb.from('products').delete().eq('id', id).then(function (r) {
        if (r.error) throw r.error;
        return removeFromStorage(p.images);
      }).then(function () { toast('Product deleted'); return loadProducts(); })
        .catch(function (er) { toast('Could not delete: ' + errText(er)); });
    }
  }

  /* ---------- Product form ---------- */
  function renderFormImgs() {
    $('#fImgs').innerHTML = state.imgs.map(function (u, i) {
      return '<div class="imgbox"><img src="' + esc(safeUrl(u)) + '" alt="Picture ' + (i + 1) + '">' +
        (i === 0 ? '<div class="main">Main picture</div>' : '<button type="button" data-iact="first" data-i="' + i + '">Make main</button>') +
        '<button type="button" data-iact="remove" data-i="' + i + '">Remove</button></div>';
    }).join('');
  }
  function updUp() { $('#fUp').textContent = state.uploading ? 'Uploading ' + state.uploading + ' picture' + (state.uploading === 1 ? '' : 's') + '…' : ''; }
  function openForm(p) {
    state.editId = p ? p.id : null;
    state.imgs = p ? p.images.slice() : [];
    state.fNew = []; state.fDelete = []; state.uploading = 0;
    $('#pfTitle').textContent = p ? 'Edit product' : 'Add product';
    $('#fCat').innerHTML = CATS.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    $('#fName').value = p ? p.name : '';
    $('#fCat').value = p ? p.category : CATS[0];
    $('#fPrice').value = p ? p.price : '';
    $('#fDesc').value = p ? p.description : '';
    $('#fSizes').value = p ? p.sizes.join(', ') : '';
    $('#fColors').value = p ? p.colors.join(', ') : '';
    $('#fStock').checked = p ? !!p.in_stock : true;
    $('#fNew').checked = p ? !!p.is_new : false;
    $('#fFeat').checked = p ? !!p.is_featured : false;
    $('#fErr').textContent = ''; $('#fFiles').value = '';
    updUp(); renderFormImgs();
    $('#pf').hidden = false;
    document.body.classList.add('lock');
    $('#fName').focus();
  }
  function closeForm(saved) {
    if (!saved) removeFromStorage(state.fNew);
    $('#pf').hidden = true;
    document.body.classList.remove('lock');
  }
  function addImages(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    var chain = Promise.resolve();
    list.forEach(function (f) {
      state.uploading++; updUp();
      chain = chain.then(function () {
        if (state.imgs.length >= 8) throw new Error('A product can have up to 8 pictures');
        return uploadImage(f, 'products', 1600).then(function (url) {
          state.imgs.push(url); state.fNew.push(url); renderFormImgs();
        });
      }).catch(function (e) {
        $('#fErr').textContent = 'A picture could not be added: ' + errText(e);
      }).then(function () { state.uploading--; updUp(); });
    });
  }
  function onImgAction(e) {
    var b = e.target.closest('[data-iact]');
    if (!b) return;
    var i = +b.getAttribute('data-i');
    if (b.getAttribute('data-iact') === 'first') {
      var u = state.imgs.splice(i, 1)[0]; state.imgs.unshift(u);
    } else {
      var gone = state.imgs.splice(i, 1)[0];
      if (state.fNew.indexOf(gone) !== -1) { state.fNew.splice(state.fNew.indexOf(gone), 1); removeFromStorage([gone]); }
      else state.fDelete.push(gone);
    }
    renderFormImgs();
  }
  function saveProduct(e) {
    e.preventDefault();
    var err = $('#fErr'); err.textContent = '';
    if (state.uploading) { err.textContent = 'Please wait for the pictures to finish uploading.'; return; }
    var name = $('#fName').value.trim();
    var price = parseFloat($('#fPrice').value);
    if (!name) { err.textContent = 'Please enter a product name.'; return; }
    if (!isFinite(price) || price < 0) { err.textContent = 'Please enter a valid price.'; return; }
    var payload = {
      name: name,
      category: $('#fCat').value,
      price: Math.round(price * 100) / 100,
      description: $('#fDesc').value.trim(),
      sizes: splitList($('#fSizes').value),
      colors: splitList($('#fColors').value),
      images: state.imgs.slice(),
      in_stock: $('#fStock').checked,
      is_new: $('#fNew').checked,
      is_featured: $('#fFeat').checked
    };
    var btn = $('#fSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    var q = state.editId ? sb.from('products').update(payload).eq('id', state.editId) : sb.from('products').insert(payload);
    q.then(function (r) {
      if (r.error) throw r.error;
      return removeFromStorage(state.fDelete);
    }).then(function () {
      closeForm(true); toast('Product saved');
      return loadProducts();
    }).catch(function (er) {
      console.error(er); err.textContent = 'Could not save: ' + errText(er);
    }).then(function () { btn.disabled = false; btn.textContent = 'Save product'; });
  }

  /* ---------- Orders ---------- */
  function loadOrders() {
    return sb.from('orders').select('*').order('created_at', { ascending: false }).limit(200).then(function (r) {
      if (r.error) throw r.error;
      state.orders = r.data || [];
      renderOrders();
    }).catch(function (e) { console.error(e); toast('Could not load orders: ' + errText(e)); });
  }
  function renderOrders() {
    var counts = { all: state.orders.length };
    STATUSES.forEach(function (s) { counts[s] = 0; });
    state.orders.forEach(function (o) { if (counts[o.status] != null) counts[o.status]++; });
    $('#tab-orders').textContent = counts['new'] ? 'Orders (' + counts['new'] + ' new)' : 'Orders';
    $('#oFilters').innerHTML = ['all'].concat(STATUSES).map(function (s) {
      return '<button type="button" data-of="' + s + '" aria-pressed="' + (state.ofilter === s) + '">' + esc(s.charAt(0).toUpperCase() + s.slice(1)) + ' (' + counts[s] + ')</button>';
    }).join('');
    var list = state.orders.filter(function (o) { return state.ofilter === 'all' || o.status === state.ofilter; });
    if (!list.length) { $('#oList').innerHTML = '<div class="card"><p class="muted" style="margin:0">No orders here yet.</p></div>'; return; }
    $('#oList').innerHTML = list.map(function (o) {
      var wa = waLink(o.phone);
      var tel = String(o.phone || '').replace(/[^\d+]/g, '');
      var lines = (Array.isArray(o.items) ? o.items : []).map(function (l) {
        var opts = [l.size ? 'Size ' + l.size : '', l.color || ''].filter(Boolean).join(', ');
        return '<li>' + esc(l.qty) + ' × ' + esc(l.name) + (opts ? ' (' + esc(opts) + ')' : '') + ' — ' + esc(money(l.price * l.qty)) + '</li>';
      }).join('');
      return '<article class="card"><div class="ohead"><strong>' + esc(o.ref) + '</strong><span class="muted">' + esc(fmtDate(o.created_at)) + '</span></div>' +
        '<div>' + esc(o.customer_name) + ' · <a href="tel:' + esc(tel) + '">' + esc(o.phone) + '</a>' + (wa ? ' · <a href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>' +
        '<div class="muted">' + esc(o.address) + '</div>' +
        (o.note ? '<div class="muted">Note: ' + esc(o.note) + '</div>' : '') +
        '<ul class="items">' + lines + '</ul>' +
        '<div class="otot">Total ' + esc(money(o.total)) + '</div>' +
        '<div class="orow"><label class="sr" for="st-' + esc(o.id) + '">Order status</label>' +
        '<select id="st-' + esc(o.id) + '" data-oid="' + esc(o.id) + '">' + STATUSES.map(function (s) {
          return '<option value="' + s + '"' + (o.status === s ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>';
        }).join('') + '</select>' +
        '<button class="btn danger" type="button" data-odel="' + esc(o.id) + '">Delete</button></div></article>';
    }).join('');
  }
  function onOrderChange(e) {
    var sel = e.target.closest('select[data-oid]');
    if (!sel) return;
    var id = sel.getAttribute('data-oid'), val = sel.value;
    sb.from('orders').update({ status: val }).eq('id', id).then(function (r) {
      if (r.error) throw r.error;
      state.orders.forEach(function (o) { if (o.id === id) o.status = val; });
      renderOrders(); toast('Order updated');
    }).catch(function (er) { toast('Could not update: ' + errText(er)); loadOrders(); });
  }
  function onOrderClick(e) {
    var f = e.target.closest('[data-of]');
    if (f) { state.ofilter = f.getAttribute('data-of'); renderOrders(); return; }
    var d = e.target.closest('[data-odel]');
    if (d) {
      if (!window.confirm('Delete this order? This cannot be undone.')) return;
      sb.from('orders').delete().eq('id', d.getAttribute('data-odel')).then(function (r) {
        if (r.error) throw r.error;
        toast('Order deleted'); return loadOrders();
      }).catch(function (er) { toast('Could not delete: ' + errText(er)); });
    }
  }

  /* ---------- Email list ---------- */
  function loadSubs() {
    return sb.from('subscribers').select('id,email,created_at').order('created_at', { ascending: false }).limit(2000).then(function (r) {
      if (r.error) throw r.error;
      state.subs = r.data || [];
      renderSubs();
    }).catch(function (e) { console.error(e); toast('Could not load the email list: ' + errText(e)); });
  }
  function renderSubs() {
    var box = $('#sList');
    if (!state.subs.length) { box.innerHTML = '<p class="muted" style="margin:0">Nobody has joined the email list yet.</p>'; return; }
    box.innerHTML = '<p class="muted" style="margin:0 0 8px">' + state.subs.length + ' email' + (state.subs.length === 1 ? '' : 's') + '</p>' +
      state.subs.map(function (s) {
        return '<div class="srow"><span>' + esc(s.email) + ' <span class="muted">· ' + esc(fmtDate(s.created_at)) + '</span></span>' +
          '<button class="btn danger" type="button" data-sdel="' + esc(s.id) + '" aria-label="Remove ' + esc(s.email) + '">Remove</button></div>';
      }).join('');
  }
  function copyEmails() {
    var text = state.subs.map(function (s) { return s.email; }).join(', ');
    if (!text) { toast('No emails to copy yet'); return; }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Emails copied'); } catch (e) { toast('Could not copy'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Emails copied'); }, fallback);
    else fallback();
  }

  /* ---------- Settings ---------- */
  var FIELDS = [
    { group: 'Ordering', items: [
      { k: 'whatsapp_number', label: 'WhatsApp number that receives orders', type: 'tel', hint: 'Include the country code, for example 2348012345678. A number that starts with 0 and has 11 digits is treated as Nigerian.' },
      { k: 'currency_symbol', label: 'Currency symbol', type: 'text', max: 5 },
      { k: 'contact_email', label: 'Contact email (shown in the footer)', type: 'email' },
      { k: 'instagram_handle', label: 'Instagram username', type: 'text', hint: 'Without the @ sign.' }
    ] },
    { group: 'Look', items: [
      { k: 'accent_color', label: 'Accent colour', type: 'select', options: [['#FF3B2F', 'Red'], ['#FFD400', 'Yellow'], ['#C8FF2F', 'Lime'], ['#FF7A1A', 'Orange']] }
    ] },
    { group: 'Words on the site', items: [
      { k: 'announcement', label: 'Top banner message (leave empty to hide)', type: 'text', max: 140 },
      { k: 'hero_eyebrow', label: 'Small line above the main headline (for example your collection name)', type: 'text', max: 60 },
      { k: 'hero_subtitle', label: 'Line under the main headline', type: 'text', max: 160 },
      { k: 'story_title', label: 'Brand story title', type: 'text', max: 80 },
      { k: 'story_text', label: 'Brand story (two or three sentences)', type: 'textarea', max: 700 },
      { k: 'delivery_text', label: 'Delivery information (leave empty to hide)', type: 'textarea', max: 300 },
      { k: 'returns_text', label: 'Returns information (leave empty to hide)', type: 'textarea', max: 300 },
      { k: 'payment_text', label: 'Payment information (leave empty to hide)', type: 'textarea', max: 300 },
      { k: 'whatsapp_text', label: 'Text next to "Order on WhatsApp" (leave empty to hide)', type: 'textarea', max: 300 }
    ] },
    { group: 'Pictures on the home page', images: [
      { k: 'img_hero', label: 'Main picture at the top (tall photos work best)' },
      { k: 'img_story', label: 'Brand story picture' }
    ].concat(CATS.map(function (c) { return { k: 'img_cat_' + slug(c), label: 'Category picture: ' + c }; })) }
  ];
  var TEXT_KEYS = [], IMG_KEYS = [];
  FIELDS.forEach(function (g) {
    (g.items || []).forEach(function (f) { TEXT_KEYS.push(f.k); });
    (g.images || []).forEach(function (f) { IMG_KEYS.push(f.k); });
  });

  function loadSettings() {
    return sb.from('settings').select('key,value').then(function (r) {
      if (r.error) throw r.error;
      var m = {};
      (r.data || []).forEach(function (x) { m[x.key] = x.value; });
      state.settings = m;
      renderSettings();
    }).catch(function (e) { console.error(e); toast('Could not load settings: ' + errText(e)); });
  }
  function fieldHtml(f) {
    var v = state.settings[f.k] == null ? '' : state.settings[f.k];
    var id = 's_' + f.k;
    var lab = '<label for="' + id + '">' + esc(f.label) + (f.hint ? ' <span class="hint">' + esc(f.hint) + '</span>' : '') + '</label>';
    if (f.type === 'textarea') return lab + '<textarea id="' + id + '" rows="3" maxlength="' + (f.max || 500) + '">' + esc(v) + '</textarea>';
    if (f.type === 'select') {
      return lab + '<select id="' + id + '">' + f.options.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (String(v).toUpperCase() === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select>';
    }
    return lab + '<input id="' + id + '" type="' + f.type + '" value="' + esc(v) + '" maxlength="' + (f.max || 200) + '">';
  }
  function imgFieldHtml(f) {
    var u = safeUrl(state.settings[f.k]);
    return '<div style="margin-top:14px"><div style="font-size:14px;font-weight:600">' + esc(f.label) + '</div><div class="imgfield">' +
      '<div class="imgprev">' + (u ? '<img src="' + esc(u) + '" alt="">' : 'No picture') + '</div>' +
      '<label class="btn alt filebtn" style="margin:0">Choose picture<input class="sr" type="file" accept="image/*" data-skey="' + esc(f.k) + '"></label>' +
      (u ? '<button class="btn danger" type="button" data-sremove="' + esc(f.k) + '">Remove</button>' : '') +
      '</div></div>';
  }
  function renderSettings() {
    var h = '';
    FIELDS.forEach(function (g) {
      h += '<section class="card"><h3>' + esc(g.group) + '</h3>';
      (g.items || []).forEach(function (f) { h += fieldHtml(f); });
      (g.images || []).forEach(function (f) { h += imgFieldHtml(f); });
      h += '</section>';
    });
    $('#setBody').innerHTML = h + '<p class="err" id="setErr" role="alert"></p><button class="btn accent" type="button" id="setSave">Save settings</button>';
  }
  function collectSettings() {
    TEXT_KEYS.forEach(function (k) {
      var el = $('#s_' + k);
      if (el) state.settings[k] = el.value.trim();
    });
  }
  function onSettingsChange(e) {
    var inp = e.target.closest('input[data-skey]');
    if (!inp || !inp.files || !inp.files[0]) return;
    var key = inp.getAttribute('data-skey'), file = inp.files[0];
    collectSettings();
    toast('Uploading picture…');
    uploadImage(file, 'site', 2000).then(function (url) {
      if (state.settings[key]) state.sDelete.push(state.settings[key]);
      state.settings[key] = url;
      renderSettings();
      toast('Picture added. Tap "Save settings" to publish it.');
    }).catch(function (er) { toast('Could not upload: ' + errText(er)); });
  }
  function onSettingsClick(e) {
    var rm = e.target.closest('[data-sremove]');
    if (rm) {
      collectSettings();
      var k = rm.getAttribute('data-sremove');
      if (state.settings[k]) state.sDelete.push(state.settings[k]);
      state.settings[k] = '';
      renderSettings();
      return;
    }
    if (e.target.closest('#setSave')) saveSettings();
  }
  function saveSettings() {
    collectSettings();
    var err = $('#setErr'); err.textContent = '';
    var wa = String(state.settings.whatsapp_number || '').replace(/\D/g, '');
    if (/^0\d{10}$/.test(wa)) wa = '234' + wa.slice(1);
    state.settings.whatsapp_number = wa;
    var okColors = ['#FF3B2F', '#FFD400', '#C8FF2F', '#FF7A1A'];
    if (okColors.indexOf(String(state.settings.accent_color || '').toUpperCase()) === -1) state.settings.accent_color = '#FF3B2F';
    var ig = String(state.settings.instagram_handle || '').replace(/^@/, '').replace(/[^A-Za-z0-9._]/g, '');
    state.settings.instagram_handle = ig;
    var rows = TEXT_KEYS.concat(IMG_KEYS).map(function (k) { return { key: k, value: String(state.settings[k] == null ? '' : state.settings[k]) }; });
    var btn = $('#setSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    sb.from('settings').upsert(rows, { onConflict: 'key' }).then(function (r) {
      if (r.error) throw r.error;
      var keep = IMG_KEYS.map(function (k) { return state.settings[k]; });
      var del = state.sDelete.filter(function (u) { return keep.indexOf(u) === -1; });
      state.sDelete = [];
      return removeFromStorage(del);
    }).then(function () {
      renderSettings(); toast('Settings saved');
    }).catch(function (er) {
      console.error(er);
      var e2 = $('#setErr'); if (e2) e2.textContent = 'Could not save: ' + errText(er);
      var b2 = $('#setSave'); if (b2) { b2.disabled = false; b2.textContent = 'Save settings'; }
    });
  }

  /* ---------- Start ---------- */
  function startApp() {
    return Promise.all([loadSettings(), loadProducts(), loadOrders()]).then(function () { setTab('products'); });
  }
  function wire() {
    $('#loginForm').addEventListener('submit', onLogin);
    $('#logout').addEventListener('click', signOut);
    $('#deniedOut').addEventListener('click', signOut);
    $$('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
    $('#pSearch').addEventListener('input', function () { state.pq = this.value; renderProducts(); });
    $('#pAdd').addEventListener('click', function () { openForm(null); });
    $('#pList').addEventListener('click', onProductAction);
    $('#pForm').addEventListener('submit', saveProduct);
    $('#fCancel').addEventListener('click', function () { closeForm(false); });
    $('#fFiles').addEventListener('change', function () { addImages(this.files); this.value = ''; });
    $('#fImgs').addEventListener('click', onImgAction);
    $('#fQuick').addEventListener('click', function (e) {
      var b = e.target.closest('[data-q]');
      if (!b) return;
      var list = splitList($('#fSizes').value), v = b.getAttribute('data-q');
      if (list.map(function (x) { return x.toLowerCase(); }).indexOf(v.toLowerCase()) === -1) list.push(v);
      $('#fSizes').value = list.join(', ');
    });
    $('#oRefresh').addEventListener('click', loadOrders);
    $('#oFilters').addEventListener('click', onOrderClick);
    $('#oList').addEventListener('click', onOrderClick);
    $('#oList').addEventListener('change', onOrderChange);
    $('#sRefresh').addEventListener('click', loadSubs);
    $('#sCopy').addEventListener('click', copyEmails);
    $('#sList').addEventListener('click', function (e) {
      var d = e.target.closest('[data-sdel]');
      if (!d) return;
      sb.from('subscribers').delete().eq('id', d.getAttribute('data-sdel')).then(function (r) {
        if (r.error) throw r.error;
        return loadSubs();
      }).catch(function (er) { toast('Could not remove: ' + errText(er)); });
    });
    $('#setBody').addEventListener('change', onSettingsChange);
    $('#setBody').addEventListener('click', onSettingsClick);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('#pf').hidden) closeForm(false);
    });
  }
  function init() {
    wire();
    if (!CONFIGURED) {
      show('loginView');
      $('#loginErr').textContent = 'This site is not connected yet. Open config.js and paste in your Supabase URL and key.';
      $('#loginBtn').disabled = true;
      return;
    }
    if (!window.supabase || !window.supabase.createClient) {
      show('loginView');
      $('#loginErr').textContent = 'Could not load the Supabase library. Check your internet connection and refresh.';
      return;
    }
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    sb.auth.getSession().then(function (r) {
      return afterAuth(r.data && r.data.session);
    }).catch(function (e) { console.error(e); show('loginView'); });
  }
  init();
})();
</script>
</body>
</html>
